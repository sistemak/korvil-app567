name: Verifica Pagamento Real Asaas - korvil.p@gmail.com

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'pendentes/**'
      - 'korvil/sections/korvil-loja/**'

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Verifica se dinheiro caiu na conta korvil.p@gmail.com
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: node .github/scripts/verifica-asaas.js
      
      - name: Commita arquivo de pago real
        run: |
          git config user.name "korvil-bot"
          git config user.email "bot@korvil.com"
          git add pagamentos/ pendentes/
          git diff --staged --quiet || git commit -m "✅ PIX confirmado real - dinheiro caiu em korvil.p@gmail.com - $(date -u)"
          git push
