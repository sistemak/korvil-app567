name: Verifica Pagamentos Asaas Real

on:
  schedule:
    - cron: '*/2 * * * *' # roda a cada 2 minutos
  workflow_dispatch: # permite rodar manual
  push:
    paths:
      - 'pendentes/**'

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Verifica Asaas se dinheiro caiu
        env:
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
        run: node .github/scripts/verifica-asaas.js
      
      - name: Salva status pago no repo
        run: |
          git config user.name "korvil-bot"
          git config user.email "bot@korvil.com"
          git add pagamentos/ pendentes/
          git diff --staged --quiet || git commit -m "Atualiza status pagamento Asaas real - $(date)"
          git push
